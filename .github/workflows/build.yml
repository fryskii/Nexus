name: build
on: [push, pull_request]

jobs:
  # Native Windows build with MSVC, plus the tests that need real Windows: the security tests stage
  # junction / symlink / hard-link attacks and need elevation (GitHub's Windows runners are elevated).
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DNEXUS_BUILD_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          $failed = $LASTEXITCODE -ne 0
          # Surface compiler diagnostics as annotations (readable without downloading logs). GitHub keeps
          # only 10 annotations per type and step, so unique lines are packed into one multi-line annotation.
          $errors = Select-String -Path build.log -Pattern ': (fatal )?error (C|LNK)\d+' | ForEach-Object { $_.Line.Trim() -replace ' \[[^\]]*\]$', '' } | Sort-Object -Unique
          $warnings = Select-String -Path build.log -Pattern ': warning (C|LNK)\d+' | ForEach-Object { $_.Line.Trim() -replace ' \[[^\]]*\]$', '' } | Sort-Object -Unique
          if ($errors) { "::error::$($errors.Count) unique errors%0A" + (($errors | Select-Object -First 80) -join '%0A') }
          if ($warnings) { "::warning::$($warnings.Count) unique warnings%0A" + (($warnings | Select-Object -First 80) -join '%0A') }
          if ($failed) { exit 1 }
      - name: Unit tests
        shell: pwsh
        run: |
          .\build\Release\nexus_tests.exe 2>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          Select-String -Path tests.log -Pattern '^FAIL|passed' | ForEach-Object { if ($_.Line -match '^FAIL') { "::error::$($_.Line)" } else { "::notice::unit tests: $($_.Line)" } }
          exit $code
      - name: Security tests (elevated)
        shell: pwsh
        run: |
          .\build\Release\nexus_security_tests.exe 2>&1 | Tee-Object -FilePath security.log
          $code = $LASTEXITCODE
          Select-String -Path security.log -Pattern '^FAIL|^skip|passed' |
            ForEach-Object { if ($_.Line -match '^FAIL') { "::error::$($_.Line)" } elseif ($_.Line -match '^skip') { "::warning::security tests $($_.Line)" } else { "::notice::security tests: $($_.Line)" } }
          exit $code
      - name: Collector benchmark
        shell: pwsh
        run: |
          $p = Start-Process .\build\Release\NEXUS.exe -ArgumentList '--bench', "$PWD\bench.json", '50' -PassThru -Wait
          $b = Get-Content bench.json -Raw | ConvertFrom-Json
          "::notice::collector: $($b.processes) processes, $([math]::Round($b.enumerateAvgMs, 2)) ms average per sample (max $([math]::Round($b.enumerateMaxMs, 2)) ms), working set $([math]::Round($b.workingSetBytes / 1MB, 1)) MB, private $([math]::Round($b.privateBytes / 1MB, 1)) MB"
      - name: UI stress (60 s)
        shell: pwsh
        run: |
          $csv = "$PWD\stress.csv"
          $p = Start-Process .\build\Release\NEXUS.exe -ArgumentList '--stress', '60', "`"$csv`"", '7' -PassThru
          if (-not $p.WaitForExit(240000)) { "::error::stress run did not finish (hang)"; Stop-Process $p -Force; exit 1 }
          if (-not (Test-Path "$csv.summary.txt")) { "::error::stress run wrote no summary (exit code $($p.ExitCode))"; exit 1 }
          Get-Content "$csv.summary.txt" | Select-Object -First 12 | ForEach-Object { "::notice::stress: $_" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-msvc
          path: |
            build/Release/NEXUS.exe
            build/Release/nexus_tests.exe
            build/Release/nexus_security_tests.exe
            *.log
            stress.csv*
            bench.json

  # Cross-compiled MinGW build: installer and portable zip.
  mingw-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64-posix nsis zip
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-dist
          path: dist/*

  # Platform-neutral core on Linux with sanitizers, plus a short fuzzing run.
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: Unit tests (ASan + UBSan)
        run: |
          clang++ -std=c++20 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc -DNEXUS_VERSION_STR='"ci"' \
            tests/tests.cpp src/core/{Format,Settings,Smbios,DiagnosticsRules,Filter,Regex}.cpp -o tests_asan
          ./tests_asan
      - name: Fuzz (5 min)
        run: tests/fuzz/run.sh "$RUNNER_TEMP/fuzz" 300
  # Pushing a tag such as v0.9.0-alpha.1 publishes the cross-built installer and zip as a GitHub
  # pre-release, once every other job has passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, mingw-cross, core-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-dist
          path: dist
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --title "NEXUS $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md dist/*.zip dist/*-setup-x64.exe dist/SHA256SUMS.txt
